name: release

# Every push to main cuts a release:
#
#   1. `test`         builds the app and runs the unit tests. Nothing is tagged
#                     until this is green, so main never grows a tag with no
#                     release behind it.
#   2. `bump`         computes the next version — a patch bump of the latest
#                     `v*` tag. To cut a minor/major instead, raise
#                     MARKETING_VERSION in Ketto.xcodeproj/project.pbxproj in
#                     your commit; a file version higher than the latest tag is
#                     used verbatim. The version is stamped into every
#                     MARKETING_VERSION and CURRENT_PROJECT_VERSION in the
#                     project, committed back to main and tagged vX.Y.Z.
#   3. `build-release` archives a universal (arm64 + x86_64) build, signs it with
#                     Developer ID, notarizes and staples it, and publishes a
#                     GitHub Release holding:
#                       Ketto-<version>.dmg       drag-to-Applications installer
#                       Ketto-macos.dmg           version-less alias, so
#                                                 releases/latest/download/ is stable
#                       Ketto-<version>.zip       the artifact Sparkle installs
#                       appcast.xml               the Sparkle feed the app polls
#                       Ketto-<version>-dSYMs.zip
#                       SHA256SUMS
#
# Signing is REQUIRED — there is no unsigned fallback, and the job fails before
# the expensive build if a secret is missing. Beyond keeping Gatekeeper quiet, a
# stable Developer ID signature is what lets a Screen Recording grant survive an
# update: macOS keys that permission to the code signature, so an ad-hoc signed
# build would re-prompt on every single release.
#
# The bump commit is pushed with GITHUB_TOKEN, and GitHub never triggers
# workflows from GITHUB_TOKEN pushes — so the bump cannot re-trigger this
# workflow (the [skip ci] in its message is belt-and-braces). That is also why
# the release builds in the SAME run instead of a separate on-tag workflow: a
# GITHUB_TOKEN-pushed tag would not fire it.
#
# Secrets (see docs/RELEASING.md for how to produce each one). The six Apple ones
# reuse the names doklin/bluesnake use, so the values can be copied across:
#   MACOS_CERTIFICATE       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD   password that .p12 was exported with
#   MACOS_SIGNING_IDENTITY  e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                Apple ID used for notarization
#   APPLE_PASSWORD          app-specific password for that Apple ID
#   APPLE_TEAM_ID           10-character team ID
#   SPARKLE_PRIVATE_KEY     EdDSA private key from Scripts/generate-sparkle-keys.sh.
#                           Its public half is committed in Ketto/Info.plist
#                           under SUPublicEDKey; the two must be a pair or every
#                           installed copy will reject the update it downloads.
#
# workflow_dispatch cuts a release manually (same test + bump + build path).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push bump commit + tag, create the GitHub Release

# Serialize runs: a second push during a release waits, then checks out the
# just-bumped main head, so its version bump lands on top (never non-fast-forward).
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ test gate
  test:
    name: Build + test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install the Metal toolchain
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain already present"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Ketto.xcodeproj \
            -scheme Ketto \
            -destination 'platform=macOS,arch=arm64'

  # -------------------------------------------------------------- version bump
  bump:
    name: Bump version + tag
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      previous_tag: ${{ steps.v.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main         # branch head (not the trigger SHA) — see concurrency note
          fetch-depth: 0    # need all tags to find the latest release

      - name: Compute next version
        id: v
        run: |
          set -euo pipefail
          file_v="$(sed -n -E 's/.*MARKETING_VERSION = ([0-9]+\.[0-9]+\.[0-9]+);.*/\1/p' \
            Ketto.xcodeproj/project.pbxproj | head -n1)"
          if [ -z "$file_v" ]; then
            echo "::error::could not read MARKETING_VERSION out of Ketto.xcodeproj/project.pbxproj"
            exit 1
          fi
          last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$last_tag" ]; then
            next="$file_v"   # first release ships the committed version as-is
          else
            tag_v="${last_tag#v}"
            IFS=. read -r maj min pat <<<"$tag_v"
            next="$maj.$min.$((pat+1))"
            # A manually raised file version (minor/major bump) beats the auto patch bump.
            if [ "$file_v" != "$tag_v" ] && \
               [ "$(printf '%s\n%s\n' "$file_v" "$tag_v" | sort -V | tail -n1)" = "$file_v" ]; then
              next="$file_v"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::tag v$next already exists — delete it or raise MARKETING_VERSION"
            exit 1
          fi
          {
            echo "version=$next"
            echo "tag=v$next"
            echo "previous_tag=$last_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous tag: ${last_tag:-none})"

      # MARKETING_VERSION is CFBundleShortVersionString (what people read) and
      # CURRENT_PROJECT_VERSION is CFBundleVersion (what Sparkle compares
      # against the appcast's sparkle:version). Both are set to the same X.Y.Z so
      # the comparison is a plain dotted-version comparison with no second
      # counter to keep in step. All four build configurations are stamped —
      # the test bundle's too, or the test host refuses to load it.
      - name: Stamp the version into the Xcode project
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          proj=Ketto.xcodeproj/project.pbxproj
          sed -i -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/g" "$proj"
          sed -i -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $VERSION;/g" "$proj"
          marketing="$(grep -c "MARKETING_VERSION = $VERSION;" "$proj")"
          current="$(grep -c "CURRENT_PROJECT_VERSION = $VERSION;" "$proj")"
          echo "stamped $marketing MARKETING_VERSION and $current CURRENT_PROJECT_VERSION entries"
          [ "$marketing" -eq 4 ] && [ "$current" -eq 4 ] || {
            echo "::error::expected 4 of each build setting, got $marketing/$current — did the project gain or lose a target?"
            exit 1
          }

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project already at $VERSION (first release) — tagging without a commit"
          else
            git commit -m "chore: release v$VERSION [skip ci]"
          fi
          git tag "v$VERSION"
          git push origin HEAD:main "refs/tags/v$VERSION"

  # ---------------------------------------------- macOS build + GitHub Release
  build-release:
    name: Build signed .dmg + Sparkle appcast, and release
    needs: bump
    runs-on: macos-26
    # Apple occasionally holds a notarization submission far longer than a normal
    # CI job would wait. If that happens the job fails; recover with "Re-run
    # failed jobs", which reuses the bump job's tag and simply resubmits.
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.bump.outputs.version }}
      TAG: ${{ needs.bump.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.bump.outputs.previous_tag }}
      APP_NAME: Ketto
    steps:
      # Fail here, before the expensive build, if anything needed to sign,
      # notarize or sign the update is missing.
      - name: Require signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$MACOS_CERTIFICATE" ]      || missing="$missing MACOS_CERTIFICATE"
          [ -n "$MACOS_CERTIFICATE_PWD" ]  || missing="$missing MACOS_CERTIFICATE_PWD"
          [ -n "$MACOS_SIGNING_IDENTITY" ] || missing="$missing MACOS_SIGNING_IDENTITY"
          [ -n "$APPLE_ID" ]               || missing="$missing APPLE_ID"
          [ -n "$APPLE_PASSWORD" ]         || missing="$missing APPLE_PASSWORD"
          [ -n "$APPLE_TEAM_ID" ]          || missing="$missing APPLE_TEAM_ID"
          [ -n "$SPARKLE_PRIVATE_KEY" ]    || missing="$missing SPARKLE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing signing secrets:$missing — see docs/RELEASING.md"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.tag }}   # the exact stamped commit
          fetch-depth: 0                       # release notes need the previous tag

      # A build whose SUPublicEDKey is still the placeholder would ship an app
      # that can never update itself, and nothing downstream would notice.
      - name: Require a real Sparkle public key
        run: |
          set -euo pipefail
          key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Ketto/Info.plist 2>/dev/null || true)"
          if [ -z "$key" ] || [ "$key" = "SPARKLE_PUBLIC_KEY_NOT_SET" ]; then
            echo "::error::Ketto/Info.plist still carries the SUPublicEDKey placeholder."
            echo "::error::Run Scripts/generate-sparkle-keys.sh and commit the public key first (docs/RELEASING.md)."
            exit 1
          fi
          echo "SUPublicEDKey is set"

      - name: Install the Metal toolchain
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain already present"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi

      # An ephemeral keychain holding only the Developer ID cert, unlocked for
      # the life of the job and thrown away with the runner.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          # Prepend, never replace: dropping the login keychain out of the search
          # list breaks other tooling on the runner for the rest of the job.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Universal (arm64 + x86_64) so Intel Macs on macOS 14/15 are covered;
      # Sparkle's XCFramework ships both slices. Signing is manual: there is no
      # Xcode account on the runner to resolve an automatic profile with, and
      # Developer ID needs no provisioning profile for these entitlements.
      - name: Archive (Developer ID, universal)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Ketto.xcodeproj \
            -scheme Ketto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export the app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Built with plutil rather than a heredoc: a YAML block scalar cannot
          # hold an unindented line, and a plist whose <?xml?> declaration is not
          # the first thing in the file is not a plist.
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string "developer-id" "$options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$options"
          plutil -insert signingStyle -string "manual" "$options"
          plutil -insert signingCertificate -string "Developer ID Application" "$options"
          # Export to disk; notarization is a separate step below, not an upload
          # from inside xcodebuild.
          plutil -insert destination -string "export" "$options"
          cat "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$options"
          ls -la "$RUNNER_TEMP/export"

      # Catches the ways a Sparkle app quietly ships broken: an unsigned nested
      # helper (Autoupdate/Updater.app inside the framework), a missing hardened
      # runtime, a dropped microphone entitlement, or a build whose feed keys did
      # not survive the Info.plist merge.
      - name: Verify the signature and the bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "flags=.*runtime" "$RUNNER_TEMP/codesign.txt" || {
            echo "::error::hardened runtime is not enabled — notarization would reject this"; exit 1; }
          # Sparkle and the helpers it launches to swap the bundle in place.
          test -d "$APP/Contents/Frameworks/Sparkle.framework" || {
            echo "::error::Sparkle.framework was not embedded — in-app updates would be dead"; exit 1; }
          codesign --verify --strict --verbose=2 "$APP/Contents/Frameworks/Sparkle.framework"
          # Under the hardened runtime the mic is unreachable without this entitlement.
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' \
            "$RUNNER_TEMP/entitlements.plist" | grep -q true || {
            echo "::error::the audio-input entitlement is missing — the microphone would fail silently"; exit 1; }
          # The feed the shipped app will poll, and the version Sparkle compares.
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist" >/dev/null
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [ "$bundle_version" = "$VERSION" ] && [ "$short_version" = "$VERSION" ] || {
            echo "::error::bundle version $bundle_version / $short_version does not match the tag $VERSION"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/$APP_NAME"

      - name: Notarize and staple the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
          ./Scripts/notarize.sh "$RUNNER_TEMP/notarize-app.zip"
          # The ticket is stapled onto the .app, so both the DMG and the Sparkle
          # archive below carry an app that passes Gatekeeper offline.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Build the DMG and the Sparkle archive
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          # Dedicated staging dir for what gets attached to the release.
          mkdir -p release-assets

          # What Sparkle downloads and swaps in: the stapled .app, zipped with
          # ditto so the bundle's symlinks and signature survive the round trip.
          ditto -c -k --keepParent "$APP" "release-assets/$APP_NAME-$VERSION.zip"

          # What a first-time user downloads: a drag-to-Applications disk image.
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" -ov -format UDZO \
            "release-assets/$APP_NAME-$VERSION.dmg"
          codesign --sign "$MACOS_SIGNING_IDENTITY" --timestamp "release-assets/$APP_NAME-$VERSION.dmg"
          # Tauri notarizes only the .app; the same is true here, so the image
          # itself is submitted separately or it trips Gatekeeper on first open.
          ./Scripts/notarize.sh "release-assets/$APP_NAME-$VERSION.dmg"
          xcrun stapler staple "release-assets/$APP_NAME-$VERSION.dmg"
          xcrun stapler validate "release-assets/$APP_NAME-$VERSION.dmg"

          # Version-less alias (copied AFTER stapling) so
          # releases/latest/download/Ketto-macos.dmg is a stable URL.
          cp "release-assets/$APP_NAME-$VERSION.dmg" "release-assets/$APP_NAME-macos.dmg"

          # dSYMs, for symbolicating a crash report from a shipped build.
          ditto -c -k --sequesterRsrc \
            "$RUNNER_TEMP/$APP_NAME.xcarchive/dSYMs" "release-assets/$APP_NAME-$VERSION-dSYMs.zip"

      # The appcast is Sparkle's equivalent of doklin's latest.json: the manifest
      # every installed copy polls at the SUFeedURL baked into its Info.plist,
      # carrying the download URL, its length, and an EdDSA signature over the
      # exact bytes. sign_update comes out of the same Sparkle release the app
      # links against — the version is read back from Package.resolved, so the
      # tool that signs and the framework that verifies cannot drift apart.
      - name: Sign the update and write appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          resolved=Ketto.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          sparkle_version="$(/usr/bin/python3 -c 'import json,sys; print(next((p["state"]["version"] for p in json.load(open(sys.argv[1]))["pins"] if p["identity"] == "sparkle"), ""))' "$resolved")"
          if [ -z "$sparkle_version" ]; then
            echo "::error::no pinned Sparkle version in $resolved"
            exit 1
          fi
          echo "Using the Sparkle $sparkle_version tools"
          curl -fsSL -o "$RUNNER_TEMP/sparkle-tools.zip" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-for-Swift-Package-Manager.zip"
          unzip -q -o "$RUNNER_TEMP/sparkle-tools.zip" -d "$RUNNER_TEMP/sparkle-tools"

          # sign_update prints the two enclosure attributes verbatim:
          #   sparkle:edSignature="…" length="…"
          key_file="$RUNNER_TEMP/sparkle_ed_key"
          install -m 600 /dev/null "$key_file"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          signature_attributes="$("$RUNNER_TEMP/sparkle-tools/bin/sign_update" \
            --ed-key-file "$key_file" "release-assets/$APP_NAME-$VERSION.zip")"
          rm -f "$key_file"

          SIGNATURE_ATTRIBUTES="$signature_attributes" \
          REPO="$GITHUB_REPOSITORY" \
          ASSET_NAME="$APP_NAME-$VERSION.zip" \
            ./Scripts/make-appcast.sh release-assets/appcast.xml
          cat release-assets/appcast.xml

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          shasum -a 256 *.dmg *.zip > SHA256SUMS
          ls -la
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          files: release-assets/*
          make_latest: 'true'
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **macOS 14+** universal (Apple Silicon and Intel) `.dmg`, Developer ID signed and notarized — opens with no Gatekeeper prompt.

            Already running Ketto? You do not need this download: the app checks
            `appcast.xml` on its own and installs the update in place from
            **Check for Updates…** in the Ketto menu.
